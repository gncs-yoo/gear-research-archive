 "https://arxiv.org/abs/2609.29112", "doi": "10.48550/arXiv.2609.29112", "summary": "단일 로봇 관절 리그에서 사이클로이드 감속기(Nabtesco RH380-N, 정격 3,724 N·m)의 전달오차를 부하 토크·속도·윤활유 온도를 다항식 인자로 하는 진폭·위상의 푸리에 급수로 모델링해 검증 대비 평균 RMSE 0.026 mrad를 달성하고, 입력측 인코더만 사용하는 피드포워드 TE 보정을 제안.", "details": {"background": "산업로봇의 경로 정확도는 공작기계 대비 100~1,000배 낮은 수준이며 주원인은 관절 감속기의 컴플라이언스와 전달오차(TE)다. 하모닉 드라이브에 비해 사이클로이드 TE 연구는 빈약하고, 부하측 엔코더 기반 보정은 비용·시스템 복잡도를 높인다.", "method": "Nabtesco RH380-N 사이클로이드를 탑재한 단일 관절 시험 리그(입력측 모터, 토크 센서, 윤활 온도 센서, 부하측 모터)에서 TE를 계측하고, 측정 스펙트럼의 조화 주파수를 감속기의 기계적 특성(기하학적 주파수 성분)과 대응시켜 파라미터를 동정. 진폭·위상을 부하 토크·속도·온도의 다항식으로 표현하는 푸리에 급수 모델을 수립하고, 엔드오브라인 계측 후 입력측 인코더만으로 운용하는 옵저버 기반 보정 로드맵을 제시.", "data": "검증 측정 대비 모델 평균 RMSE 0.026 mrad. 부하 1,000 N·m, 속도 −2.5°/s, 윤활유 온도 27°C 조건의 TE 신호에서 조화 성분 식별. 연구 데이터셋 공개(DARUS-4454). 선행 컴플라이언스 보상 연구와 결합 시 경로 오차 81% 저감 가능성(문헌 근거).", "implications": "휴머노이드 하체 중부하 관절(사이클로이드/RV)의 상태(부하·속도·온도) 의존 TE를 모델 기반 피드포워드로 보정하는 실무 절차를 제공. 1호의 양방향 동적 TE·로스트모션 계측 프레임워크와 결합하면 부하·온도별 TE 지도 기반 관절 품질 승인 기준과 소프트웨어 보정 사양을 수립할 수 있다."}}, {"id": 4, "date": "2026-11-04", "batch": "2026-11-04 (2호 브리핑)", "categories": ["그리퍼·핸드구동계"], "title_en": "Design and Validation of an Antagonistic Tendon-Driven Dexterous Robotic Hand with Bidirectional Operation", "title_ko": "양방향 대항(대항근) 텐던 구동 17-DOF 드렉스터러스 로봇 핸드 설계 및 검증", "journal": "arXiv:2609.36241 / IEEE 투고 심사 중 (2026)", "authors": "Chunghyeon Lee, Hyukjun Kwon, Sungeon Kim, Saehyun Moon, Seokhwan Jeong (Texas A&M University / 서강대학교)", "link": "https://arxiv.org/abs/2609.36241", "doi": "10.48550/arXiv.2609.36241", "summary": "인간 실측 크기(200 mm, 220 g) 17-자유도 3D프린팅 의수형 핸드에 수동 복원 스프링 없는 양방향 대항 텐던 라우팅(BATM)을 적용해 손바닥·손등 양면 파지를 실현하고, 모터-관절 전달오차 3.0%, 관절 전달 대역폭 13.2 Hz, 최대 악력 29 N, 반복정밀도 0.15 mm를 실증.", "details": {"background": "기존 의수형 핸드는 손바닥 한쪽으로만 굽는 인체의 비대칭을 그대로 계승해 반대편 파지 시 손목·팔 재배향이 필요하다. 관절마다 고감속 기어를 내장하면 말단 질량·반사 관성·마찰이 커져 충격 순응성이 떨어지고, 수동 스프링 복원 텐던 방식은 대역폭 한계, 완전 대항 구동은 모터 수 급증이라는 트레이드오프를 갖는다.", "method": "관절 중립 위치에 대해 대칭인 가동 범위 설계와, 중립을 경계로 커플링이 사라지는 텐던 라우팅 경로(BATM)를 결합해 굴곡/신전·외전/내전을 모두 능동 구동. FE 관절에 미니어처 풀리-베어링 조립체를 넣어 관절-텐던 슬라이딩 마찰을 구름 마찰로 대체하고, 2중 홈 풀리로 굴곡/신전 텐던을 독립 라우팅. 엄지 대향(OP)과 수지 대칭 구조로 양면 파지 확장.", "data": "평균 모터-관절 전달오차 3.0%, 평균 관절 전달 대역폭 13.2 Hz, 최대 악력(팁 접촉력) 29 N, 위치 반복정밀도 0.15 mm. Kapandji 점수 8/8, GRASP Taxonomy 33종 전체 파지 수행, 손바닥·손등 양면 파지 과업 실증.", "implications": "고감속 감속기의 백래시·마찰 대신 대항 텐던 전달과 저마찰 라우팅(구름 접촉화)으로 말단 핸드의 역구동성과 대역폭을 확보하는 설계 기준을 제공. 1호의 차동 직접구동(DDD) 그리퍼와 함께 인체 크기 말단 구동계의 저마찰·양방향 아키텍처 비교 검토의 기준점이 될 수 있다."}}, {"id": 3, "date": "2026-11-03", "batch": "2026-11-03 (1호 브리핑)", "categories": ["NVH·전달오차·소음진동", "정밀감속기·관절기구학"], "title_en": "Analysis and Suppression of Tonal Whine and High-Frequency Dynamic Excitations in Humanoid Actuation Modules", "title_ko": "휴머노이드 관절 액추에이터의 치맞물림 톤 와인(Whine) 및 고주파 진동소음 기전 분석과 저감 기술", "journal": "Applied Sciences (MDPI, Vol. 16, 2026) & Humanoid.guide Research (2026)", "authors": "Hepeng Ni, Mengchen Du, Yuhui Hou 외 / Humanoid Engineering Analysis", "link": "https://doi.org/10.3390/app16178826", "doi": "10.3390/app16178826", "summary": "다관절(20~40축) 휴머노이드 집적 시 발생하는 1 kHz 대역 감속기 치맞물림(Mesh) 톤 와인과 조립 편차에 따른 하모닉 고조파 전달오차 전파 모델링(잔차 65% 저감) 및 소음 저감 설계 레버 분석.", "details": {"background": "가정·서비스 환경 휴머노이드는 다수 관절이 동시 작동하므로 단일 관절 소음(50 dB(A))이 중첩되어 전체 소음이 63 dB(A) 이상으로 증폭됨. 특히 치맞물림 고주파 와인(1 kHz)과 PWM 스위칭 노이즈, 하모닉 유연륜 조립 편심에 의한 전달오차가 제품 수용성을 저해함.", "method": "Top-hat형 하모닉 감속기의 조립 경사 및 편심에 따른 전달오차 전파 모델을 수립하고 주파수 영역 특성 매칭으로 파라미터 규명. 치맞물림 주파수(f_mesh), 모터 코깅 토크, PWM 스위칭(16~20 kHz 고주파화), 트랙션(무치차) 및 텐던 드라이브 기구학적 소음 레버 비교.", "data": "조립 경사를 반영한 전달오차 통합 모델 적용 시 최대 잔차 65%, MSE 95% 감소. 1단 헬리컬화 및 치형 프로파일 수정(Microgeometry) 적용 시 와인 음압 8~10 dB(A) 저감. 트랙션 기반 감속기는 37~50 dB(A) 이하, 텐던 복합 구동계는 로봇 전체 22 dB 수준 달성.", "implications": "현대모비스 e-Axle에서 검증된 치형수정(마이크로지오메트리) 기법과 공차 제어 노하우를 소형 로봇 관절 감속기에 적용하여, 1단 헬리컬 최적화 및 20 kHz 이상 PWM 스위칭 설계를 통해 인간 공존형 저소음 휴머노이드 관절 양산 규격을 수립하는 핵심 기준 제공."}}, {"id": 2, "date": "2026-11-03", "batch": "2026-11-03 (1호 브리핑)", "categories": ["그리퍼·핸드구동계", "임바디먼트·동적계측"], "title_en": "Ultra-Low-Impedance Robotic Gripper for High-Bandwidth and Transparent Physical Interaction", "title_ko": "고대역폭 및 물리적 투명성 확보를 위한 차동 직접구동(DDD) 기반 초저임피던스 로봇 그리퍼", "journal": "arXiv:2608.09198 / IEEE (2026)", "authors": "Joon Lee, Ari Choi, Seokhwan Jeong", "link": "https://arxiv.org/abs/2608.09198", "doi": "10.48550/arXiv.2608.09198", "summary": "고감속 기어열의 마찰·백래시·반사관성을 제거하기 위해 3지 9-자유도 그리퍼에 베이스 모터 집중 배치와 1:2 차동 기어를 결합하여, 수동 임피던스 50.1 N/m 달성 및 외장 센서리스 고유수용성 고대역 힘 제어 실증.", "details": {"background": "기존 로봇 핸드는 파지력 확보를 위해 고감속비 기어를 채택했으나, 이로 인해 높은 마찰과 반사 관성(J_m*n^2)이 발생하여 미세 접촉력 감지 및 충격 순응 제어가 어렵고 외장 F/T 센서 의존도가 높아짐.", "method": "핑거 베이스에 DD 모터를 집중 배치하여 가동 링크 관성을 극소화하고, MCP 관절 굴곡 시 2개 모터를 병렬 구동하여 토크를 2배 증폭하는 1:2 저감속비 차동 기어 전달계(Differential Direct-Drive) 설계. IP 관절은 4절 링크로 1:1 선형 매핑 구현.", "data": "공칭 악력 약 18 N, 팁 접촉력 4.7 N 달성. 모터의 시스템 반사 관성 기여도를 0.236%로 극소화하고 모터 비통전 시 수동 기계 임피던스를 최대 50.1 N/m로 억제. 외장 센서 없이 모터 전류만으로 고대역 접촉력 추정 및 순응성 실증.", "implications": "로봇 말단 덱스터러스 핸드에서 고감속 감속기의 백래시와 비선형 마찰 문제를 탈피하여, 1:2 저감속 차동 기어와 다이렉트 드라이브 결합을 통해 정밀 힘 제어와 충격 흡수 능력을 양립하는 실용적 구동 메커니즘을 제시."}}, {"id": 1, "date": "2026-11-03", "batch": "2026-11-03 (1호 브리핑)", "categories": ["정밀감속기·관절기구학", "임바디먼트·동적계측", "NVH·전달오차·소음진동"], "title_en": "Precision Reducers as Embodiment Enablers for Physical AI–Driven Humanoid Manufacturing Robots", "title_ko": "피지컬 AI 휴머노이드 로봇을 위한 정밀 감속기 특성 및 동적 계측 프레임워크", "journal": "International Journal of Precision Engineering and Manufacturing (IJPEM, Springer, 2026)", "authors": "Hyeong-Joon Ahn", "link": "https://doi.org/10.1007/s12541-026-01504-w", "doi": "10.1007/s12541-026-01504-w", "summary": "휴머노이드 로봇 관절의 하모닉·사이클로이드/RV·유성 감속기를 대상으로 정적 백래시 지표의 한계를 규명하고, 양방향 미소 반전 및 접촉 충격 하에서 동적 전달오차(Dynamic TE), 로스트 모션, 토크 리플을 평가하는 원샷(One-shot) 계측 프레임워크 수립.", "details": {"background": "기존 감속기 평가는 강성, 정적 백래시 등 단편 지표(ISO 9283)에 의존했으나, 접촉과 양방향 토크 역전이 빈번한 휴머노이드 환경에서는 제어/학습 불안정성의 원인이 감속기 비선형성(마찰, 히스테리시스, 전달오차)에서 비롯됨.", "method": "토크 밀도, 역구동성, 순응성, 열/에너지 효율, 양방향 정밀도의 5대 임바디먼트 프레임워크를 수립하고, 부하 작동 중 입출력 토크·속도·온도를 동기 측정하여 로스트 모션, 동적 전달오차(TE), 주기 효율을 일체로 계측하는 'One-shot Metrology' 제안.", "data": "하모닉 드라이브의 정적 백래시(1 arcmin 미만)와 달리 부하 반전(-20↔+20 N·m) 시 동적 로스트 모션은 평균 7.74~8.10 arcmin으로 급증함을 실증(예측 모델 정확도 95.56%). 사이클로이드/RV의 편심 질량 기인 1차 회전 불평형 진동 및 하모닉 유연륜(Flexspline) 피로 특성 규명.", "implications": "하체 보행 관절(사이클로이드/RV/롤러 스크루)과 상체 정밀 조작 관절(하모닉/QDD)의 이종 감속기 전략(Heterogeneous reducer strategy) 필요성을 확립하고, 카탈로그 정적 백래시가 아닌 양방향 동적 전달오차 기반의 모비스 로봇 관절 품질 검증 표준 수립에 기여."}}];
    const categories = ["전체", "정밀감속기·관절기구학", "그리퍼·핸드구동계", "NVH·전달오차·소음진동", "선형구동·롤러스크루", "임바디먼트·동적계측"];
    let activeCategory = "전체";

    function initFilters() {
      const container = document.getElementById("categoryFilter");
      container.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      initFilters();
      filterPapers();
    }

    function filterPapers() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = papersData.filter(paper => {
        const matchesCategory = (activeCategory === "전체") || (paper.categories && paper.categories.includes(activeCategory));
        const matchesQuery = !query || 
          paper.title_ko.toLowerCase().includes(query) ||
          paper.title_en.toLowerCase().includes(query) ||
          (paper.authors && paper.authors.toLowerCase().includes(query)) ||
          (paper.journal && paper.journal.toLowerCase().includes(query)) ||
          (paper.summary && paper.summary.toLowerCase().includes(query)) ||
          (paper.details && (
            (paper.details.background && paper.details.background.toLowerCase().includes(query)) ||
            (paper.details.method && paper.details.method.toLowerCase().includes(query)) ||
            (paper.details.data && paper.details.data.toLowerCase().includes(query)) ||
            (paper.details.implications && paper.details.implications.toLowerCase().includes(query))
          ));
        return matchesCategory && matchesQuery;
      });

      renderGrid(filtered);
    }

    function renderGrid(papers) {
      const grid = document.getElementById("paperGrid");
      const empty = document.getElementById("emptyState");

      if (papers.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      grid.innerHTML = papers.map(paper => `
        <article class="paper-card">
          <div class="card-header">
            <div class="meta-tags">
              <span class="tag batch">${paper.batch || paper.date}</span>
              ${(paper.categories || []).map(c => `<span class="tag category">${c}</span>`).join('')}
            </div>
            <span class="paper-id">#${String(paper.id).padStart(2, '0')}</span>
          </div>

          <h2 class="card-title-ko">${paper.title_ko}</h2>
          <div class="card-title-en">${paper.title_en}</div>

          <div class="card-biblio">
            <span>📚 ${paper.journal || ''}</span>
            <span>✍️ ${paper.authors || ''}</span>
            <span>📅 ${paper.date || ''}</span>
          </div>

          <div class="card-summary">
            <strong>핵심 요약:</strong> ${paper.summary || ''}
          </div>

          <button class="details-toggle" onclick="toggleDetails(this)">
            <span>심층 분석 데이터 보기</span> ▼
          </button>

          <div class="details-content" style="display: none;">
            <div class="detail-section">
              <h4>🎯 연구 배경 및 해결 과제</h4>
              <p>${paper.details?.background || '-'}</p>
            </div>
            <div class="detail-section">
              <h4>⚙️ 제안 메커니즘 및 연구 방법론</h4>
              <p>${paper.details?.method || '-'}</p>
            </div>
            <div class="detail-section">
              <h4>📊 핵심 정량 데이터 및 실험 결과</h4>
              <p>${paper.details?.data || '-'}</p>
            </div>
            <div class="detail-section">
              <h4>💡 휴머노이드 구동계 실무 시사점</h4>
              <p>${paper.details?.implications || '-'}</p>
            </div>
          </div>

          <div class="card-footer">
            ${paper.link ? `<a href="${paper.link}" target="_blank" rel="noopener noreferrer" class="doi-btn">원문 링크 / DOI ↗</a>` : ''}
          </div>
        </article>
      `).join('');
    }

    function toggleDetails(btn) {
      const content = btn.nextElementSibling;
      const isOpen = content.style.display !== "none";
      content.style.display = isOpen ? "none" : "flex";
      btn.innerHTML = isOpen ? "<span>심층 분석 데이터 보기</span> ▼" : "<span>접기</span> ▲";
    }

    initFilters();
    filterPapers();
  </script>
</body>
</html>
