    const categories = ["전체", "정밀감속기·관절기구학", "그리퍼·핸드구동계", "NVH·전달오차·소음진동", "선형구동·롤러스크루", "임바디먼트·동적계측"];
    let activeCategory = "전체";

    function initFilters() {
      const container = document.getElementById("categoryFilter");
      container.innerHTML = categories.map(cat => `
        <button class="filter-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      initFilters();
      filterPapers();
    }

    function filterPapers() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      const filtered = papersData.filter(paper => {
        const matchesCategory = (activeCategory === "전체") || (paper.categories && paper.categories.includes(activeCategory));
        const matchesQuery = !query || 
          paper.title_ko.toLowerCase().includes(query) ||
          paper.title_en.toLowerCase().includes(query) ||
          (paper.authors && paper.authors.toLowerCase().includes(query)) ||
          (paper.journal && paper.journal.toLowerCase().includes(query)) ||
          (paper.summary && paper.summary.toLowerCase().includes(query)) ||
          (paper.details && (
            (paper.details.background && paper.details.background.toLowerCase().includes(query)) ||
            (paper.details.method && paper.details.method.toLowerCase().includes(query)) ||
            (paper.details.data && paper.details.data.toLowerCase().includes(query)) ||
            (paper.details.implications && paper.details.implications.toLowerCase().includes(query))
          ));
        return matchesCategory && matchesQuery;
      });

      renderGrid(filtered);
    }

    function renderGrid(papers) {
      const grid = document.getElementById("paperGrid");
      const empty = document.getElementById("emptyState");

      if (papers.length === 0) {
        grid.innerHTML = "";
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";
      grid.innerHTML = papers.map(paper => `
        <article class="paper-card">
          <div class="card-header">
            <div class="meta-tags">
              <span class="tag batch">${paper.batch || paper.date}</span>
              ${(paper.categories || []).map(c => `<span class="tag category">${c}</span>`).join('')}
            </div>
            <span class="paper-id">#${String(paper.id).padStart(2, '0')}</span>
          </div>

          <h2 class="card-title-ko">${paper.title_ko}</h2>
          <div class="card-title-en">${paper.title_en}</div>

          <div class="card-biblio">
            <span>📚 ${paper.journal || ''}</span>
            <span>✍️ ${paper.authors || ''}</span>
            <span>📅 ${paper.date || ''}</span>
          </div>

          <div class="card-summary">
            <strong>핵심 요약:</strong> ${paper.summary || ''}
          </div>

          <button class="details-toggle" onclick="toggleDetails(this)">
            <span>심층 분석 데이터 보기</span> ▼
          </button>

          <div class="details-content" style="display: none;">
            <div class="detail-section">
              <h4>🎯 연구 배경 및 해결 과제</h4>
              <p>${paper.details?.background || '-'}</p>
            </div>
            <div class="detail-section">
              <h4>⚙️ 제안 메커니즘 및 연구 방법론</h4>
              <p>${paper.details?.method || '-'}</p>
            </div>
            <div class="detail-section">
              <h4>📊 핵심 정량 데이터 및 실험 결과</h4>
              <p>${paper.details?.data || '-'}</p>
            </div>
            <div class="detail-section">
              <h4>💡 휴머노이드 구동계 실무 시사점</h4>
              <p>${paper.details?.implications || '-'}</p>
            </div>
          </div>

          <div class="card-footer">
            ${paper.link ? `<a href="${paper.link}" target="_blank" rel="noopener noreferrer" class="doi-btn">원문 링크 / DOI ↗</a>` : ''}
          </div>
        </article>
      `).join('');
    }

    function toggleDetails(btn) {
      const content = btn.nextElementSibling;
      const isOpen = content.style.display !== "none";
      content.style.display = isOpen ? "none" : "flex";
      btn.innerHTML = isOpen ? "<span>심층 분석 데이터 보기</span> ▼" : "<span>접기</span> ▲";
    }

    initFilters();
    filterPapers();
  </script>
</body>
</html>
